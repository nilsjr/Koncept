console-reports:
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    #  - 'FindingsReport'
    - 'FileBasedFindingsReport'
    - 'LiteFindingsReport'

ktlint:
  ArgumentListWrapping:
    active: false
  Filename:
    active: false
  MaximumLineLength:
    active: false
  ImportOrdering:
    active: true
  Indentation:
    active: false
  FinalNewline:
    insertFinalNewLine: true
  ParameterListWrapping:
    indentSize: 4

Compose:
  active: false

